<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexChat</title>
<meta name="theme-color" content="#08090c" />
</head>
<body style="background:#08090c">
<!-- NexChat is a single-page app now (index.html). This page only forwards
     old links and bookmarks to the matching place in it. -->
<script>
(function () {
  var shell = window.__NX_SHELL__;
  var q = new URLSearchParams(shell ? shell.search : location.search);
  var route = q.get('join') ? 'home' : 'home';
  var target = 'index.html' + (q.get('invite') ? '?invite=' + encodeURIComponent(q.get('invite')) : '') + '#/' + route;
  if (shell) shell.go(target); else location.replace(target);
})();
</script>
</body>
</html>
