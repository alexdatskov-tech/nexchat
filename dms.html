<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#08090D" />
<title>NexChat — Messages</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg?v=62" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="assets/css/theme.css?v=62" />
<script src="assets/js/ambient.js?v=62"></script>
</head>
<body>
<div class="app">
<nav class="spaces" id="spaces"></nav>
<div class="shell" id="shell">
  <aside class="rail dm-rail" id="rail">
    <div class="rail-head">
      <a class="home" href="portal.html" title="Home"><i class="fa-solid fa-house"></i></a>
      <div class="meta"><b>Messages</b><small id="dmSub">Direct &amp; group chats</small></div>
      <button class="btn btn-quiet btn-icon" id="btnNewDm" title="New conversation"><i class="fa-solid fa-pen-to-square"></i></button>
    </div>

    <div class="dm-tabs">
      <button class="on" data-tab="chats">Chats</button>
      <button data-tab="friends">Friends</button>
      <button data-tab="groups" id="tabGroups" class="hidden">Groups</button>
      <button data-tab="requests">Requests <span class="pill hidden" id="reqPill">0</span></button>
    </div>
    <div class="dm-search"><input id="dmFilter" class="input" placeholder="Search" /></div>
    <div class="dm-list" id="dmList"></div>

    <div class="rail-foot">
      <a class="me" href="profile.html">
        <span id="meAv"></span>
        <span class="nm"><b id="meName">…</b><small id="meHandle"></small></span>
      </a>
      <button class="btn btn-quiet btn-icon" id="btnOut" title="Sign out"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-head" id="chatHead">
      <button class="btn btn-quiet btn-icon m-burger" id="burger" title="Menu"><i class="fa-solid fa-bars"></i></button>
      <span id="convAv"></span>
      <b id="convName">Select a conversation</b>
      <span class="topic hidden" id="convSub"></span>
      <span style="flex:1"></span>
      <button class="btn btn-quiet btn-icon hidden" id="btnCall" title="Start a voice call"><i class="fa-solid fa-phone"></i></button>
      <button class="btn btn-quiet btn-icon hidden" id="btnVideoCall" title="Start a video call"><i class="fa-solid fa-video"></i></button>
      <button class="btn btn-quiet btn-icon hidden" id="btnConvInfo" title="Details"><i class="fa-solid fa-circle-info"></i></button>
    </header>

    <div class="vroom hidden" id="vroom">
      <div class="vroom-head">
        <span class="vr-ico"><i class="fa-solid fa-phone"></i></span>
        <div class="vr-t"><b id="vrName">Call</b><small id="vrSub"></small></div>
        <div class="vr-right"><button class="btn btn-ghost btn-sm" id="vrChat"><i class="fa-solid fa-comment"></i> Chat</button></div>
      </div>
      <div class="vroom-stage" id="vrStage"></div>
      <div class="vstats hidden" id="vstats"></div>
      <div class="vroom-bar">
        <button class="vbtn" id="vrMute" title="Mute"><i class="fa-solid fa-microphone"></i></button>
        <button class="vbtn" id="vrDeaf" title="Deafen"><i class="fa-solid fa-headphones-simple"></i></button>
        <button class="vbtn" id="vrCam" title="Camera"><i class="fa-solid fa-video-slash"></i></button>
        <button class="vbtn" id="vrShare" title="Share screen"><i class="fa-solid fa-display"></i></button>
        <button class="vbtn sm" id="vrStats" title="Connection info"><i class="fa-solid fa-signal"></i></button>
        <span class="vbar-sep"></span>
        <button class="vbtn hang" id="vrLeave" title="Hang up"><i class="fa-solid fa-phone-slash"></i></button>
      </div>
    </div>

    <div class="msgs" id="msgs">
      <div class="empty" style="margin:auto;">
        <div class="ico"><i class="fa-solid fa-comments"></i></div>
        <h3>Your messages</h3>
        <p>Pick a conversation on the left, or start a new one with the pencil.</p>
      </div>
    </div>

    <div class="composer hidden" id="composer">
      <div class="upbar hidden" id="upbar"><i style="width:0"></i></div>
      <div class="tray hidden" id="tray"></div>
      <div class="composer-inner">
        <button class="attach-btn" id="attachBtn" title="More"><i class="fa-solid fa-plus"></i></button>
        <textarea id="input" rows="1" placeholder="Message"></textarea>
        <button class="emoji-btn" id="emojiBtn" title="Emoji"><i class="fa-regular fa-face-smile"></i></button>
        <button class="btn btn-primary send" id="send" title="Send"><i class="fa-solid fa-arrow-up"></i></button>
      </div>
      <input type="file" id="fileIn" multiple class="hidden" />
    </div>
  </main>
</div>
</div>

<div class="overlay hidden" id="mNew">
  <div class="modal" style="max-width:420px;">
    <div class="modal-head"><h3>New conversation</h3><button class="x-btn" data-close><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body">
      <div class="field">
        <label for="addUser">Add a friend by username</label>
        <div class="copyrow">
          <input id="addUser" class="input" placeholder="alexander" />
          <button class="btn btn-ghost" id="addUserGo">Add</button>
        </div>
        <span class="hint">They'll get a friend request you can message once accepted.</span>
      </div>
      <div class="field">
        <label>Start a group chat</label>
        <input id="groupName" class="input" placeholder="Group name" />
        <div id="friendPicks" style="margin-top:10px;max-height:220px;overflow-y:auto;"></div>
      </div>
      <p class="err" id="newErr"></p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-quiet" data-close>Cancel</button>
      <button class="btn btn-primary" id="groupGo">Create group</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=62"></script>
<script src="assets/js/supabase-client.js?v=62"></script>
<script src="assets/js/ui.js?v=62"></script>
<script src="assets/js/glass.js?v=62"></script>
<script src="assets/js/md.js?v=62"></script>
<script src="assets/js/vendor/core/runtime/net/xhr-transport-polyfill.min.js?v=62"></script>
<script src="assets/js/cloudgate.js?v=62"></script>
<script src="assets/js/storage.js?v=62"></script>
<script src="assets/js/tiff.js?v=62"></script>
<script src="assets/js/viewer.js?v=62"></script>
<script src="assets/js/ice.js?v=62"></script>
<script src="assets/js/voice.js?v=62"></script>
<script src="assets/js/callui.js?v=62"></script>
<script src="assets/js/presence.js?v=62"></script>
<script src="assets/js/guard.js?v=62"></script>
<script src="assets/js/notify.js?v=62"></script>
<script src="assets/js/emoji-data.js?v=62"></script>
<script src="assets/js/emoji-picker.js?v=62"></script>
<script src="assets/js/composer-plus.js?v=62"></script>
<script src="assets/js/nav.js?v=62"></script>
<script src="assets/js/dms.js?v=62"></script>
</body>
</html>
